# === DankMaterialShell idle config (managed) - do not edit manually ===

general {
    before_sleep_cmd = loginctl lock-session $XDG_SESSION_ID
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

## -- BRIGHTNESS (AC)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 5%
    on-resume = brightnessctl -r
    condition_cmd = for s in /sys/class/power_supply/*/; do t=$(cat $s/type 2>/dev/null); [ "$t" = "Battery" ] || continue; if [ -f $s/status ]; then [ "$(cat $s/status)" = "Discharging" ] && exit 1; elif [ -f $s/online ]; then [ "$(cat $s/online)" = "0" ] && exit 1; fi; done; exit 0
    condition_retry = 0
}

## -- BRIGHTNESS (BATTERY)
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 5%
    on-resume = brightnessctl -r
    condition_cmd = for s in /sys/class/power_supply/*/; do t=$(cat $s/type 2>/dev/null); [ "$t" = "Battery" ] || continue; if [ -f $s/status ]; then [ "$(cat $s/status)" = "Discharging" ] && exit 0; elif [ -f $s/online ]; then [ "$(cat $s/online)" = "0" ] && exit 0; fi; done; exit 1
    condition_retry = 0
}

## -- DPMS (AC)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
